name: Scheduled rebuild

# The site reads releases.json and the PolicyManifest.json files from the main OIB repo at build time.
# The main repo triggers a deploy when those change (see .github/workflows/notify-docs.yml there);
# this nightly rebuild is the fallback if that trigger is missed.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_PAGES_DEPLOY_HOOK is not set"; exit 1
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
