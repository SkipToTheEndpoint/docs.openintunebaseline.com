name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - run: npm ci

      # Reads releases.json from the main OIB repo; fails closed if it can't be fetched.
      # The links validator fails the build on broken internal links, including links to hidden platforms.
      - run: npm run build

      - name: Check page freshness
        run: npm run check:freshness
